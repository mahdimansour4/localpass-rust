name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/release/localpass dist/localpass
          tar -C dist -czf localpass-linux-x86_64.tar.gz localpass

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: localpass-linux-x86_64.tar.gz
